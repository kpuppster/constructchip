name: Probe dependencies
on:
  push:
    branches: [probe-deps]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          echo "=== create releases"; curl -sL https://maven.createmod.net/com/simibubi/create/create-1.21.1/maven-metadata.xml | grep -E "<version>6\.0\.(9|10)" | tail -8
          echo "=== create 6.0.10 files"; curl -sL https://maven.createmod.net/com/simibubi/create/create-1.21.1/6.0.10/ | grep -o 'href="[^"]*"' | head
          echo "=== modrinth search"
          curl -sG https://api.modrinth.com/v2/search --data-urlencode 'query=vista' --data-urlencode 'limit=8' | jq -r '.hits[] | .slug + " | " + .title + " | " + .author'
          echo "=== curseforge-ish search via modrinth author mehvahdjukaar"
          curl -s https://api.modrinth.com/v2/user/MehVahdJukaar/projects | jq -r '.[] | .slug + " | " + .title' | head -40
