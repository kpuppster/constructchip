name: Probe dependencies
on:
  push:
    branches: [probe-deps]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          curl -sL -o g.jar "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-neoforge-1.21.1/4.9.3/geckolib-neoforge-1.21.1-4.9.3.jar"
          for c in software/bernie/geckolib/renderer/GeoArmorRenderer software/bernie/geckolib/animatable/GeoItem software/bernie/geckolib/animatable/client/GeoRenderProvider software/bernie/geckolib/constant/DataTickets; do
            echo "=== $c"; javap -cp g.jar "$c" | grep -v lambda | grep -E "public|protected" | head -60
          done
