name: Probe dependencies
on:
  push:
    branches: [probe-deps]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          curl -sL -o vista.jar https://cdn.modrinth.com/data/zuARv1N7/versions/OKGvtqQj/vista-1.21.1-5.6.2-neoforge.jar
          curl -sL -o moon.jar https://cdn.modrinth.com/data/twkfQtEc/versions/6F5EyGym/moonlight-1.21.1-3.8.0-neoforge.jar
          echo "=== modrinth version ids"; curl -s https://api.modrinth.com/v2/version/OKGvtqQj | jq -r '.version_number'; curl -s https://api.modrinth.com/v2/version/6F5EyGym | jq -r '.version_number'
          for c in net/mehvahdjukaar/vista/common/tv/PowerState net/mehvahdjukaar/vista/common/broadcast/IBroadcastLocation net/mehvahdjukaar/vista/common/broadcast/LevelBEBroadcastLocation; do
            echo "=== $c"; javap -p -cp vista.jar "$c" | grep -v 'lambda\$'
          done
          for c in net/mehvahdjukaar/moonlight/api/misc/TileOrEntityTarget net/mehvahdjukaar/moonlight/api/platform/network/NetworkHelper net/mehvahdjukaar/moonlight/api/platform/network/Message; do
            echo "=== $c"; javap -p -cp moon.jar "$c" | grep -v 'lambda\$' | head -60
          done
