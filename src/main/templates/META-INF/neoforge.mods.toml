license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

logoFile="constructchip_logo.png"

credits="Chip art, GUI panel, glitch shader and sounds by Ikeda (Capri mod), used with permission. Rajdhani font: Indian Type Foundry (SIL OFL 1.1)."

